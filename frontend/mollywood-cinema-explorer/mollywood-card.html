<html><head><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Work+Sans:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+Malayalam:wght@700&amp;display=swap" rel="stylesheet">
<style>
  .mollywood-card{
    --teal-950:#0a2e2a;
    --teal-900:#0d3b36;
    --gold:#c9a227;
    --gold-soft:#e0c463;
    --brick:#a6402a;
    --cream:#f3ecd9;
    --slate:#8fa8a1;

    max-width:340px;
    background:var(--teal-900);
    border:1px solid var(--teal-950);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    position:relative;
    overflow:hidden;
    text-decoration:none;
    display:block;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .mollywood-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(0,0,0,0.35);}
  .mollywood-card .card-art{
    height:120px;
    position:relative;
    background:linear-gradient(180deg, var(--teal-900), var(--teal-950));
  }
  .mollywood-card .card-art svg{position:absolute; inset:0; width:100%; height:100%;}
  .mollywood-card .card-kara{
    height:8px;
    background:
      linear-gradient(135deg, transparent 50%, var(--gold) 50%) 0 0/8px 8px repeat-x,
      linear-gradient(-135deg, transparent 50%, var(--gold) 50%) 0 0/8px 8px repeat-x;
    background-color:var(--teal-950);
  }
  .mollywood-card .card-body{padding:18px 20px 20px;}
  .mollywood-card .card-mal{
    font-family:'Noto Sans Malayalam', serif;
    font-size:14px;
    color:var(--gold-soft);
    letter-spacing:.02em;
    margin-bottom:2px;
  }
  .mollywood-card .card-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:24px;
    letter-spacing:-0.01em;
  }
  .mollywood-card .card-desc{
    font-size:13.5px;
    color:var(--slate);
    margin-top:8px;
    line-height:1.5;
  }
  .mollywood-card .card-meta{
    margin-top:14px;
    display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold-soft);
  }
  .mollywood-card .card-arrow{transition:transform .2s ease;}
  .mollywood-card:hover .card-arrow{transform:translateX(4px);}
</style>

</head><body><main><a class="mollywood-card" href="index.html" aria-label="Explore Mollywood — Malayalam Cinema">
  <div class="card-art">
    <svg viewBox="0 0 340 120" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <rect width="340" height="120" fill="#0d3b36"></rect>
      <rect y="95" width="340" height="25" fill="#0a2e2a"></rect>
      <g fill="#0a2e2a">
        <g transform="translate(40,60)"><rect x="-2" y="0" width="4" height="40" rx="2"></rect><path d="M0,0 C-20,-8 -34,-4 -44,6 C-30,3 -16,5 0,7 Z"></path><path d="M0,0 C20,-10 36,-5 46,5 C31,0 18,3 0,6 Z"></path></g>
        <g transform="translate(290,50) scale(1.1)"><rect x="-2" y="0" width="4" height="40" rx="2"></rect><path d="M0,0 C-20,-8 -34,-4 -44,6 C-30,3 -16,5 0,7 Z"></path><path d="M0,0 C20,-10 36,-5 46,5 C31,0 18,3 0,6 Z"></path></g>
      </g>
      <circle cx="170" cy="45" r="20" fill="none" stroke="#c9a227" stroke-width="2" opacity="0.85"></circle>
      <circle cx="170" cy="45" r="3" fill="#c9a227"></circle>
    </svg>
  </div>
  <div class="card-kara"></div>
  <div class="card-body">
    <div class="card-mal">മോളിവുഡ്</div>
    <div class="card-title">Mollywood</div>
    <p class="card-desc">Malayalam cinema's journey from 1928's first silent frame to its New Generation wave — films, directors, and awards.</p>
    <div class="card-meta">
      <span>Malayalam Cinema</span>
      <span class="card-arrow">→</span>
    </div>
  </div>
</a></main>
</body></html>
