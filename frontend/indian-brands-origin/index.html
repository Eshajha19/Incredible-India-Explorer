<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Brands by State: Origin Map | Incredible India</title>
    <link rel="stylesheet" href="../pages-common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="brands-page">
    <header class="header">
        <nav class="navbar" aria-label="Navigation">
            <div class="nav-container">
                <a href="../index.html" class="logo">
                    <img src="../assets/icons/mandala.svg" alt="Incredible India Explorer Logo">
                    <span>Incredible India</span>
                </a>
                <div class="nav-links">
                    <a href="../index.html" class="nav-item">Home</a>
                    <a href="#" class="nav-item">Destinations</a>
                    <a href="#" class="nav-item active">Culture</a>
                    <a href="../sports/sports.html" class="nav-item">Sports</a>
                </div>
                <button class="theme-toggle" aria-label="Toggle dark mode" id="theme-toggle-btn">
                    <span class="moon-icon">🌙</span>
                    <span class="sun-icon">☀️</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="page-container">
        <div class="page-header">
            <span class="badge">Business Heritage</span>
            <h1>Indian Brands by State</h1>
            <p>Explore notable Indian brands by their state of origin.</p>
        </div>

        <div class="layout-container">
            <!-- Left Side: India Map -->
            <div class="map-section">
                <div class="map-controls">
                    <button id="all-india-btn" class="active-filter">All India</button>
                    <span id="current-state-display" class="state-display">Showing: All India</span>
                </div>
                <div class="map-container">
                    <svg id="india-map" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
                        <g id="map-paths">
                            <!-- Paths injected by JS -->
                        </g>
                    </svg>
                    <!-- Tooltip -->
                    <div id="map-tooltip" class="tooltip hidden">State Name</div>
                </div>
            </div>

            <!-- Right Side: Brand Cards -->
            <div class="content-section">
                <div class="brands-grid" id="brands-grid">
                    <!-- Cards injected by JS -->
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>© 2026 Incredible India Explorer. Open Source Project.</p>
        </div>
    </footer>

    <!-- Use existing scripts if possible, else we rely on our script.js -->
    <script src="../app.js"></script>
    <script src="../india-map-data.js"></script>
    <script src="script.js"></script>


</body></html>
