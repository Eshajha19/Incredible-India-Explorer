<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Indian Sports Trophy | Incredible India</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="quiz-page">
    <header class="header">
        <nav class="navbar" aria-label="Navigation">
            <div class="nav-container">
                <a href="../../index.html" class="logo">
                    <img src="../../assets/icons/mandala.svg" alt="Incredible India Explorer Logo">
                    <span>Incredible India</span>
                </a>
                <div class="nav-links">
                    <a href="../../index.html" class="nav-item">Home</a>
                    <a href="#" class="nav-item">Destinations</a>
                    <a href="#" class="nav-item">Culture</a>
                    <a href="../sports/sports.html" class="nav-item active">Sports</a>
                </div>
                <button class="theme-toggle" aria-label="Toggle dark mode" id="theme-toggle-btn">
                    <span class="moon-icon">🌙</span>
                    <span class="sun-icon">☀️</span>
                </button>
                <button class="hamburger-menu" aria-label="Open menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>
    </header>

    <main class="quiz-container">
        <!-- Header & Scoreboard -->
        <div class="quiz-header">
            <div class="quiz-titles">
                <span class="badge">Interactive Game</span>
                <h1>Guess the Sports Trophy</h1>
                <p>Test your knowledge of Indian sports by identifying famous trophies.</p>
            </div>
            
            <div class="scoreboard-card">
                <h3>Score</h3>
                <p class="score-display"><span id="score-correct">0</span> / <span id="score-total">0</span></p>
                <button id="reset-score-btn" class="text-btn">Reset Score</button>
            </div>
        </div>

        <!-- Settings -->
        <div class="settings-card">
            <label for="difficulty-select">Difficulty:</label>
            <select id="difficulty-select" class="difficulty-select">
                <option value="easy">Easy (Full Image)</option>
                <option value="medium">Medium (Silhouette + Full Options)</option>
                <option value="hard">Hard (Silhouette Only)</option>
            </select>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <div class="trophy-display-card">
                <div class="trophy-image-container" id="trophy-image-container">
                    <!-- SVG Trophy injected here -->
                </div>
                <div class="result-banner hidden" id="result-banner">
                    <!-- Result feedback -->
                </div>
            </div>

            <div class="interaction-area">
                <div class="options-grid" id="options-grid">
                    <!-- Buttons injected by JS -->
                </div>

                <!-- Info Card (Hidden until answered) -->
                <div class="trophy-info-card hidden" id="trophy-info-card">
                    <h2 id="info-name">Trophy Name</h2>
                    <div class="info-details">
                        <p><strong>Sport:</strong> <span id="info-sport"></span></p>
                        <p><strong>Tournament:</strong> <span id="info-tournament"></span></p>
                        <p class="credit-text"><em>Credit: <span id="info-credit"></span></em></p>
                    </div>
                    <button id="next-question-btn" class="primary-btn">Next Trophy</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>© 2026 Incredible India Explorer. Open Source Project.</p>
        </div>
    </footer>

    <script src="../../app.js"></script>
    <script src="script.js"></script>


</body></html>
